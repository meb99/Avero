[workspace]
resolver = "2"
members = ["crates/avero-formats", "src-tauri"]
default-members = ["crates/avero-formats"]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/meb99/Avero"
authors = ["meb99"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
