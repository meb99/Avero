name: Release

# Publishes a universal DMG and a Windows installer as a GitHub release,
# fully automatic:
#
# - after CI passed on main, when the version in src-tauri/tauri.conf.json
#   has no release yet (bump the version, push, done);
# - for a pushed tag like v0.5.1;
# - by hand: Actions → Release → Run workflow, optionally with a version.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.5.1 (empty: the version in tauri.conf.json)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # A CI run that failed or ran for something other than a push never releases.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      publish: ${{ steps.exists.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT" ]; then
            tag="v${INPUT#v}"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released, nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  dmg:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: Avero ${{ needs.check.outputs.tag }}
          releaseCommitish: ${{ needs.check.outputs.sha }}
          releaseBody: |
            **Mac:** `Avero_…_universal.dmg` für Apple Silicon und Intel (macOS 13 oder neuer).
            **Windows:** `Avero_…_x64-setup.exe` für Windows 10 und 11 (64 Bit).

            Installation auf dem Mac: DMG öffnen, Avero in den Programme-Ordner ziehen. Avero ist nicht von Apple notarisiert:
            - macOS 13/14: beim ersten Start Rechtsklick auf Avero → Öffnen.
            - macOS 15: einmal starten, dann Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen".
            - oder im Terminal: `xattr -dr com.apple.quarantine /Applications/Avero.app`

            Installation unter Windows: Setup starten, Avero wird für den eigenen Benutzer eingerichtet (ohne Administratorrechte). Das Setup ist nicht signiert: SmartScreen meldet „Der Computer wurde durch Windows geschützt" → „Weitere Informationen" → „Trotzdem ausführen".

            Die Datei wird während des Releases nachgereicht: der Windows-Build läuft nach dem Mac-Build.
          releaseDraft: false
          args: --target universal-apple-darwin

  windows:
    # After the Mac build, which creates the release; adds the installer to it.
    needs: [check, dmg]
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tauri build -- --bundles nsis
      # A fixed name, as the in-app update downloads it: Avero_<version>_x64-setup.exe.
      - name: Upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          version="${TAG#v}"
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -n 1)
          test -n "$setup"
          cp "$setup" "Avero_${version}_x64-setup.exe"
          gh release upload "$TAG" "Avero_${version}_x64-setup.exe" --clobber --repo "$GITHUB_REPOSITORY"
