name: Release

# Push a tag like v0.5.0 to build a universal DMG and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Avero ${{ github.ref_name }}
          releaseBody: |
            Universal-DMG für Apple Silicon und Intel (macOS 13 oder neuer).

            Installation: DMG öffnen, Avero in den Programme-Ordner ziehen. Avero ist nicht von Apple notarisiert:
            - macOS 13/14: beim ersten Start Rechtsklick auf Avero → Öffnen.
            - macOS 15: einmal starten, dann Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen".
            - oder im Terminal: `xattr -dr com.apple.quarantine /Applications/Avero.app`
          releaseDraft: false
          args: --target universal-apple-darwin
