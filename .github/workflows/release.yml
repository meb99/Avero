name: Release

# Builds a universal DMG and publishes it as a GitHub release, either for a
# pushed tag like v0.5.0 or started by hand (Actions → Release → Run
# workflow) with a version, which then also creates the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.5.0 (the tag v0.5.0 is created on the chosen branch)"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Avero ${{ env.TAG }}
          releaseBody: |
            Universal-DMG für Apple Silicon und Intel (macOS 13 oder neuer).

            Installation: DMG öffnen, Avero in den Programme-Ordner ziehen. Avero ist nicht von Apple notarisiert:
            - macOS 13/14: beim ersten Start Rechtsklick auf Avero → Öffnen.
            - macOS 15: einmal starten, dann Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen".
            - oder im Terminal: `xattr -dr com.apple.quarantine /Applications/Avero.app`
          releaseDraft: false
          args: --target universal-apple-darwin
