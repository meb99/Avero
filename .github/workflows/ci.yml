name: CI

on:
  push:
    # local/**: branches from local Windows sessions, where Smart App Control blocks cargo's build scripts.
    branches: [main, "local/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  formats:
    name: Formats (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p avero-formats --all-targets -- -D warnings
      - run: cargo test -p avero-formats

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: macOS app
    needs: [formats, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p avero
      - name: Build Avero.app
        run: npm run tauri build -- --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: Avero.app
          path: target/release/bundle/macos/Avero.app
          retention-days: 14

  windows:
    name: Windows app
    needs: [formats, frontend]
    runs-on: windows-latest
    steps:
      # Files as they are in the repository (tests compare bytes).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # One test of the XZZ converter (conversion.rs, kept unchanged by the project's rules)
      # builds its expected path with "/", which Windows writes "\"; it runs on macOS.
      - run: cargo test -p avero -- --skip conversion::tests::finds_xzz_in_subfolders_and_ignores_other_pcb_formats_and_symlinks
      - name: Build the Windows installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Avero-Windows-Setup
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 14
