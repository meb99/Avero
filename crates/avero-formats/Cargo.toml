[package]
name = "avero-formats"
description = "Readers for boardview file formats used in electronics repair."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
des = "0.9"
encoding_rs = "0.8"
quick-xml = "0.42"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[[bin]]
name = "avero-inspect"
path = "src/bin/avero-inspect.rs"

[[bin]]
name = "xzz-to-gencad"
path = "src/bin/xzz-to-gencad.rs"
